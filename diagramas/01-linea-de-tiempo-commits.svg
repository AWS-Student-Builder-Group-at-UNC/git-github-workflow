<svg viewBox="0 0 800 320" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="800" height="320" fill="#0d1117"/>

  <text x="400" y="42" text-anchor="middle" fill="#f0f6fc" font-size="24" font-weight="700">
    Con Git: fotos (commits) en el tiempo
  </text>
  <text x="400" y="66" text-anchor="middle" fill="#8b949e" font-size="14">
    Cada commit es una "foto" completa de tu proyecto en ese momento
  </text>

  <!-- timeline line -->
  <line x1="90" y1="180" x2="710" y2="180" stroke="#30363d" stroke-width="3"/>

  <!-- commit nodes -->
  <g>
    <circle cx="130" cy="180" r="14" fill="#238636"/>
    <text x="130" y="225" text-anchor="middle" fill="#c9d1d9" font-size="13">Commit 1</text>
    <text x="130" y="245" text-anchor="middle" fill="#8b949e" font-size="12">"Primer borrador"</text>

    <circle cx="310" cy="180" r="14" fill="#238636"/>
    <text x="310" y="225" text-anchor="middle" fill="#c9d1d9" font-size="13">Commit 2</text>
    <text x="310" y="245" text-anchor="middle" fill="#8b949e" font-size="12">"Agrego sección X"</text>

    <circle cx="490" cy="180" r="14" fill="#238636"/>
    <text x="490" y="225" text-anchor="middle" fill="#c9d1d9" font-size="13">Commit 3</text>
    <text x="490" y="245" text-anchor="middle" fill="#8b949e" font-size="12">"Corrijo error"</text>

    <circle cx="670" cy="180" r="16" fill="#58a6ff"/>
    <text x="670" y="225" text-anchor="middle" fill="#58a6ff" font-size="13" font-weight="700">HEAD</text>
    <text x="670" y="245" text-anchor="middle" fill="#8b949e" font-size="12">estado actual</text>
  </g>

  <!-- arrow indicating you can travel back -->
  <path d="M 490 130 Q 300 90 140 130" fill="none" stroke="#f0883e" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
  <text x="315" y="85" text-anchor="middle" fill="#f0883e" font-size="13">
    Podés volver a cualquier punto, siempre
  </text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#f0883e" />
    </marker>
  </defs>

  <text x="400" y="295" text-anchor="middle" fill="#8b949e" font-size="14">
    No se pierde nada: todo el historial queda guardado, commit por commit.
  </text>
</svg>
