<svg viewBox="0 0 800 420" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="800" height="420" fill="#0d1117"/>

  <text x="400" y="45" text-anchor="middle" fill="#f0f6fc" font-size="24" font-weight="700">
    Sin control de versiones...
  </text>
  <text x="400" y="72" text-anchor="middle" fill="#8b949e" font-size="14">
    ¿Te suena esta carpeta?
  </text>

  <!-- Folder icon -->
  <g transform="translate(60,110)">
    <path d="M0 10 h50 l12 16 h130 v130 h-192 z" fill="#f0883e" opacity="0.15" stroke="#f0883e" stroke-width="2"/>
    <text x="96" y="90" text-anchor="middle" fill="#f0883e" font-size="46">📁</text>
  </g>

  <!-- File chips cascading, growing messier -->
  <g font-size="14">
    <rect x="290" y="115" width="230" height="34" rx="6" fill="#161b22" stroke="#30363d"/>
    <text x="305" y="137" fill="#c9d1d9">📄 documento.docx</text>

    <rect x="310" y="160" width="270" height="34" rx="6" fill="#161b22" stroke="#30363d"/>
    <text x="325" y="182" fill="#c9d1d9">📄 documento_final.docx</text>

    <rect x="330" y="205" width="310" height="34" rx="6" fill="#161b22" stroke="#f0883e"/>
    <text x="345" y="227" fill="#f0883e">📄 documento_final_v2.docx</text>

    <rect x="350" y="250" width="380" height="34" rx="6" fill="#161b22" stroke="#da3633"/>
    <text x="365" y="272" fill="#ff7b72">📄 documento_final_v2_ESTE_SI_YA.docx</text>

    <rect x="330" y="295" width="360" height="34" rx="6" fill="#161b22" stroke="#da3633"/>
    <text x="345" y="317" fill="#ff7b72">📄 documento_final_v2_copia (3).docx</text>
  </g>

  <!-- confused face -->
  <text x="700" y="230" font-size="48" text-anchor="middle">🤯</text>

  <text x="400" y="385" text-anchor="middle" fill="#8b949e" font-size="15">
    ¿Cuál era la versión buena? ¿Qué cambié entre una y otra? ¿Quién editó qué?
  </text>
  <text x="400" y="408" text-anchor="middle" fill="#58a6ff" font-size="15" font-weight="600">
    Git resuelve exactamente este problema.
  </text>
</svg>
